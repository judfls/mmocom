  <title>Motor Machine Orchestra</title>

  <style>
    html {
      background-image: url("img/background1.png");
      background-repeat: repeat;
      background-size: 100px;
      image-rendering: pixelated;

    }

    #header1 {
      text-align: center;
      display: block;
      margin: auto;
      margin-top: 20px;
      margin-bottom: 20px;
      width: 50%;

    }

    #navbar {

      text-align: center;
      display: block;
      margin: auto;

      width: 50%;

      filter: drop-shadow(0 0 10px);
      transition: transform 0.2s ease, filter 0.2s ease;

    }

    #navbar img:hover {

      transform: scale(1.1);
      filter: brightness(110%);
      transition: transform 0.2s ease, filter 0.2s ease;

    }

    #textbox {
      background-image: url("img/paper background.gif");
      background-repeat: repeat;
      background-size: 100px;
      background-clip: content-box;

      width: 842px;
      display: block;
      margin: auto;

      border-style: solid;
      border-width: 10px;
      border-image-source: url("img/paperwallsfilled.png");
      border-image-slice: 5;
      border-image-width: 10px;
      border-image-outset: 0;
      border-image-repeat: round;
    }


    #center {
      text-align: center;

      margin: auto;

      width: 50%;

    }

    #notbg {

      position: relative;

    }

    #all {
      position: relative;

    }


    #paratext {
      text-align: center;
    }

    #paratext2 {
      text-align: center;
      font-size: large;
    }

    #volume {
      position: absolute;
      margin: 15px;

    }

    #rhover {
      float: right;
      margin: 20px;
    }

    table {
      width: 100%;
      table-layout: fixed;
      /* forces equal column widths */
      border-collapse: collapse;
    }

    td {
      margin: 30px;
    }

    @media (max-width: 768px) {


      #navbar {
        width: 100%;
        display: flex;
        justify-content: center;
        gap: 6px;
        flex-wrap: nowrap;
      }

      #navbar img {

        max-width: 120px;
        height: auto;
        margin: 0;
      }

      #header1 {
        width: 90%;
      }


      #textbox {
        width: 95%;
        box-sizing: border-box;
      }


      #rhover {
        float: none;
        display: block;
        margin: 20px auto;
        max-width: 80%;
        height: auto;
      }


      table,
      tbody,
      tr,
      td {
        display: block;
        width: 100%;
      }

      td {
        margin-bottom: 20px;
      }


      #volume {
        position: fixed;
        top: 10px;
        left: 10px;
        width: 40px;
        z-index: 1000;
      }
    }
  </style>

</head>
